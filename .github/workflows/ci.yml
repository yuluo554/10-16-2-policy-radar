name: CI

on: [push, pull_request, workflow_dispatch]

# 只读令牌：本仓 CI 不写任何远端状态（默认权限是宽的那一档）。
permissions:
  contents: read

# 同一 ref 的新推送取消上一次未完成的运行（省 runner，且避免旧提交的结论盖住新的）。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 项目底线 3.12（`requires-python = ">=3.12"`，由 PEP 639 的 setuptools>=77 决定）。
          # 原四矩阵是 ubuntu/windows × 3.8/3.12；3.8 已在 M6 后退役。
          - os: windows-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.12"
    env:
      # 编码三加固之一：CI job 里 `python -m pytest` 不是我们敲的命令、没有 -X utf8，
      # 测试内部打印中文会 UnicodeEncodeError。这条环境变量救 CI 全部步骤。
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install (README 那条安装通路)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test suite
        run: python -m pytest -q

      - name: CLI smoke — 裸 console script（安装面第四面：`python -m` 与裸命令是两条通路）
        run: |
          policy-radar version
          policy-radar selftest --data-root data

      - name: CLI smoke — python -m 形态（README 另一条通路）
        run: |
          python -m policy_radar version
          python -m policy_radar selftest --data-root data

      - name: 已落地命令的用法错误必须 exit 2（digest 缺参；M5 后 digest/run 已落地，exit 3 契约整项退役）
        shell: bash
        run: |
          set +e
          python -m policy_radar digest
          code=$?
          echo "digest (missing args) exit=$code"
          test "$code" = "2"

      - name: 日报渲染必须离线可达（M5 digest：冻结 diff 产物 + subscribe 产物 → Markdown/HTML，退出码 0）
        shell: bash
        run: |
          set +e
          python -m policy_radar diff --current data/snapshots/pair-B.json --out out/ci-diff.json --snapshot-out out/ci-snapshot.json
          code_diff=$?
          echo "diff exit=$code_diff"
          test "$code_diff" = "0"
          # 用冻结 diff 产物构造零命中的 subscribe 产物（CI 离线，ASCII 单行命令；
          # 不用 heredoc——YAML 块内缩进会破坏 heredoc 终止符对齐）
          python -c "import json;d=json.load(open('out/ci-diff.json',encoding='utf-8'));items=d['items'];h={'format':'policy-radar-subscribe','format_version':1,'item_count':len(items),'hit_count':0,'excluded_count':0,'zero_hit_count':len(items),'hits':[],'excluded':[],'zero_hit_ids':[it['id'] for it in items]};json.dump(h,open('out/ci-subscribe.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)"
          python -m policy_radar digest --new-items out/ci-diff.json --hits out/ci-subscribe.json --out out/ci-report.md --format both
          code=$?
          echo "digest exit=$code"
          test "$code" = "0"

      - name: 真值基准必须达标（M4 bench：三套件生产实现实算 + 门槛判定，联网无关）
        shell: bash
        run: |
          set +e
          python -m policy_radar bench --data-root data
          code=$?
          echo "bench exit=$code"
          test "$code" = "0"

      - name: 已落地子命令的用法错误必须 exit 2（**参数非法时不发任何请求**，CI 不依赖外网）
        shell: bash
        run: |
          set +e
          python -m policy_radar fetch --pages 0
          code=$?
          echo "fetch --pages 0 exit=$code"
          test "$code" = "2"
