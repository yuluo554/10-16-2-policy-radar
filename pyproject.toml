[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "policy-radar"
version = "0.1.0"
description = "政策文件雷达：本地定时抓取国务院与部委政策库，快照 diff 检测新发文件，产出可订阅关键词的中文日报"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "yuluo554" }]
keywords = ["policy", "gov.cn", "snapshot-diff", "cli", "chinese"]
# 运行时零第三方依赖：抓取用 urllib、解析用 re、CLI 用 argparse、写盘用 io。
dependencies = []

[project.optional-dependencies]
# 唯一 extras：测试期依赖。README 快速开始那条安装命令必须用它。
dev = ["pytest>=7,<9"]

[project.scripts]
policy-radar = "policy_radar.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["policy_radar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 中文控制台/CI 双保险：入口自身有编码守卫，这里再钉一次环境变量。
addopts = "-q"
